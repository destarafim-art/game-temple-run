 if(S.cave){const[a,b]=S.cave,len=b-a,c=-(a+len/2);
  for(const sd of[-1,1])mk(BOX,'#3b3d38',2,5,len,sd*3.1,2.5,c,G);
  mk(BOX,'#34362f',8.2,2,len,0,5,c,G);
  for(let q=a+3.5;q<b;q+=7){for(const sd of[-1,1]){mk(BOX,'#4a4a42',.5,3.4,.7,sd*2.2,1.7,-q,G);
   const t=new THREE.Sprite(SM);t.scale.set(2.2,2.2,1);t.position.set(sd*1.95,1.9,-q);G.add(t);mk(SPH,'#ffb347',.1,.1,.1,sd*1.95,1.9,-q,G,0xffa030)}
   mk(BOX,'#4a4a42',4.9,.5,.7,0,3.4,-q,G)}}
 mk(BOX,'#5d5e55',4.6,3,1.4,0,1.5,-(L+4.3),G);mk(BOX,'#3d6b3a',4.6,.4,1.4,0,3.05,-(L+4.3),G);
 return S}
function nxt(S){const o=S.o.clone().addScaledVector(fw(S.psi),S.L+1.7);return mkSeg(o,S.psi-S.jd*Math.PI/2,100+(rnd()*70|0),rnd()<.5?-1:1,false)}
function kill(S){scene.remove(S.G);S.G.traverse(o=>{if(o.isInstancedMesh&&o.dispose)o.dispose()});S.pg.dispose()}

function mkPlayer(){const p=new THREE.Group(),b=new THREE.Group();p.add(b);
 const lg=x=>{const g=new THREE.Group();g.position.set(x,.78,0);mk(BOX,'#c8a45a',.2,.62,.24,0,-.31,0,g);mk(BOX,'#5a3a1e',.22,.14,.3,0,-.7,-.03,g);b.add(g);return g};
 p.L=lg(-.15);p.R=lg(.15);
 mk(BOX,'#1fa3a3',.56,.62,.32,0,1.1,0,b);mk(BOX,'#157a7a',.4,.42,.2,0,1.12,.24,b);
 const ar=x=>{const g=new THREE.Group();g.position.set(x,1.38,0);mk(BOX,'#1fa3a3',.14,.5,.16,0,-.24,0,g);mk(SPH,'#e8b88a',.08,.08,.08,0,-.52,0,g);b.add(g);return g};
 p.AL=ar(-.37);p.AR=ar(.37);
 mk(SPH,'#e8b88a',.2,.2,.2,0,1.66,0,b);mk(CYL,'#d9b45c',.42,.04,.42,0,1.72,0,b);mk(CYL,'#e8c872',.23,.17,.23,0,1.8,0,b);mk(CYL,'#2f7d4f',.235,.05,.235,0,1.74,0,b);
 p.b=b;scene.add(p);return p}
function mkFox(){const f=new THREE.Group(),O='#ff8a1e',E=0x5a2000;f.legs=[];f.tails=[];
 mk(SPH,O,.5,.45,.7,0,.75,0,f,E);mk(SPH,O,.3,.28,.3,0,1.05,-.65,f,E);
 mk(CONE,O,.1,.3,.1,-.18,1.38,-.65,f,E);mk(CONE,O,.1,.3,.1,.18,1.38,-.65,f,E);
 mk(SPH,'#ff2a1a',.05,.05,.05,-.12,1.1,-.93,f,0xff2200);mk(SPH,'#ff2a1a',.05,.05,.05,.12,1.1,-.93,f,0xff2200);
 for(const[x,z]of[[-.25,-.35],[.25,-.35],[-.25,.35],[.25,.35]]){const g=new THREE.Group();g.position.set(x,.5,z);mk(BOX,'#c9540a',.16,.5,.18,0,-.25,0,g);f.add(g);f.legs.push(g)}
 for(let i=0;i<9;i++){const t=new THREE.Group();t.position.set(0,.85,.55);t.rotation.set(.85,0,(i-4)*.3);
  mk(CONE,i%2?'#ff7a1a':'#f26a0c',.17,1.5,.17,0,.75,0,t,E);mk(SPH,'#ffe3b8',.12,.12,.12,0,1.5,0,t);f.add(t);f.tails.push(t)}
 scene.add(f);return f}
const pl=mkPlayer(),fx=mkFox(),fl=new THREE.PointLight(0xff7a1e,0,9);scene.add(fl);

let st='ready',T=0,ph=0,dist=0,coinsN=0,score=0,best=0,lane=1,px=0,yj=0,vy=0,sl=0,chase=0,dch=0,inv=0,shake=0,slow=1,hmx=0,caveF=0,light=1,s=0,hd=0,cy=0,cur=null,prev=null;
const off=new V3();
try{best=+localStorage.getItem('lr3-best')||0}catch(e){}
function newGame(){[cur,cur&&cur.next,prev].forEach(x=>x&&kill(x));sid=0;prev=null;cur=mkSeg(new V3(0,0,0),0,150,rnd()<.5?-1:1,true);cur.next=nxt(cur);s=0;off.set(0,0,0);hd=0;cy=0}
function reset(){lane=1;px=0;yj=0;vy=0;sl=0;chase=0;dch=0;inv=0;shake=0;slow=1;dist=0;coinsN=0;score=0;hmx=0;caveF=0;newGame()}
function hurt(o){
 if(inv>0)return;inv=1.3;shake=.3;chase+=.5;slow=0;
 if(o.type==='rock'){const f=[0,1,2].filter(l=>l!==lane&&!cur.obs.some(t=>t.type==='rock'&&t.l===l&&t.s-s<=2&&t.s+t.len-s>=-2)).sort((a,b)=>Math.abs(a-lane)-Math.abs(b-lane));if(f.length)lane=f[0]}}
function turn(){
 const pOld=cur.o.clone().addScaledVector(fw(cur.psi),s).addScaledVector(rt(cur.psi),px).add(off),N=cur.next;
 if(prev)kill(prev);prev=cur;cur=N;cur.next=nxt(N);s=0;lane=1;px=0;hmx=0;off.copy(pOld).sub(cur.o)}
function die(){
 st='over';chase=1;hint.textContent='';bgm.pause();if(score>best){best=score;try{localStorage.setItem('lr3-best',best)}catch(e){}}
 $('tt').textContent='Dimangsa!';
 $('tx').textContent='Skor '+score+'  ·  Rekor '+best+'\nKoin '+coinsN+'  ·  Jarak '+Math.floor(dist)+' m';
 $('bt').textContent='Lari lagi';ov.classList.remove('hide')}
let muted=false;bgm.volume=.55;
const playM=()=>{if(!muted){const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}};
mu.onclick=()=>{muted=!muted;mu.textContent=muted?'♪ mati':'♪ nyala';if(muted)bgm.pause();else if(st==='play')playM()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(st==='play')playM()});
function start(){reset();ov.classList.add('hide');st='play';bgm.currentTime=0;playM()}
$('bt').onclick=start;

function step(dt,play){
 T+=dt;slow=Math.min(1,slow+dt*.5);
 const v=play?(15+Math.min(15,dist/70))*(.6+.4*slow):12,dz=v*dt,cvv=cur.cave;
 dist+=dz;s+=dz;ph+=dt*v*.5;
 caveF+=((cvv&&s>cvv[0]-5&&s<cvv[1]+2?1:0)-caveF)*Math.min(1,dt*3);
 light=.65+.35*Math.sin(dist/150-.5);
 if(s>cur.L+3){if(play)hurt({type:'x'});turn()}
 if(!play)return;
 px+=((lane-1)*LS-px)*Math.min(1,dt*14);
 if(yj>0||vy>0){vy-=26*dt;yj+=vy*dt;if(yj<=0){yj=0;vy=0}}
 if(sl>0)sl-=dt;
 inv-=dt;shake-=dt;chase=Math.max(0,chase-dt*.04);dch+=(chase-dch)*Math.min(1,dt*5);hmx+=(px-hmx)*Math.min(1,dt*4);
 for(const o of cur.obs){const z=o.s-s;
  if(o.hit||Math.abs((o.l-1)*LS-px)>.62||z>.5||z+o.len<-.5)continue;
  if(o.type==='rock'||(o.type==='log'&&yj<.6)||(o.type==='vine'&&sl<=0)||(o.type==='gap'&&yj<.25)){o.hit=1;hurt(o)}}
 for(const c of cur.coins)if(c.m.visible&&Math.abs((c.l-1)*LS-px)<.7&&Math.abs(c.s-s)<.9&&yj<1.6){c.m.visible=false;coinsN++}
 score=Math.floor(dist)+coinsN*10;
 const jz=cur.L-s;hint.textContent=jz<30&&jz>-3?(cur.jd<0?'◀ Geser kiri!':'Geser kanan! ▶'):'';
 if(chase>=1)die()}

function render(dt){
 const f=fw(cur.psi),r=rt(cur.psi),lv=light*(1-caveF*.75);off.multiplyScalar(Math.exp(-dt*9));
 const P=cur.o.clone().addScaledVector(f,s).addScaledVector(r,px).add(off);
 hd+=ad(cur.psi-hd)*Math.min(1,dt*10);cy+=ad(cur.psi-cy)*Math.min(1,dt*3.2);
 const w=Math.sin(ph),air=yj>0;
 pl.position.set(P.x,yj,P.z);pl.rotation.y=hd;pl.visible=!(inv>0&&((inv*14|0)%2));
 pl.L.rotation.x=air?.5:w*.9;pl.R.rotation.x=air?-.3:-w*.9;pl.AL.rotation.x=air?-1.5:-w*.8;pl.AR.rotation.x=air?-1.5:w*.8;
 pl.b.scale.y=sl>0&&!air?.55:1;
 const gap=4.2-3*dch,fk=.8+.3*dch;
 fx.position.copy(P).addScaledVector(fw(hd),-gap).addScaledVector(r,hmx-px);fx.position.y=0;fx.rotation.y=hd;fx.scale.setScalar(fk);
 fx.legs.forEach((l,i)=>l.rotation.x=Math.sin(ph*1.1+i*1.6)*.9);fx.tails.forEach((t,i)=>t.rotation.z=(i-4)*.3+Math.sin(T*3+i)*.09);
 const cf=fw(cy);cam.position.set(P.x-cf.x*6.4,3.7-caveF*.8+yj*.3,P.z-cf.z*6.4);
 if(shake>0){cam.position.x+=(rnd()-.5)*shake*1.4;cam.position.y+=(rnd()-.5)*shake*1.4}
 cam.lookAt(P.x+cf.x*7,1.1,P.z+cf.z*7);
 hemi.intensity=.3+.95*lv;sun.intensity=(.1+.95*light)*(1-caveF*.85);
 scene.fog.color.setRGB(.05+.87*lv,.09+.8*lv,.13+.68*lv);scene.fog.near=40-caveF*34;scene.fog.far=190-caveF*120;
 sky.material.color.setRGB(.12+.88*light,.18+.82*light,.32+.68*light);sky.position.copy(cam.position);ground.position.set(P.x,-1,P.z);
 lant.position.set(P.x,2.4,P.z);lant.intensity=(1-lv)*3+.4;
 fl.position.set(fx.position.x,1.4,fx.position.z);fl.intensity=.5+(1-lv)*1.6;
 for(const S of[cur,cur.next])for(const c of S.coins)if(c.m.visible)c.m.rotation.y+=dt*4;
 R.render(scene,cam);
 const vg=dch>.2?'radial-gradient(circle,transparent 45%,rgba(200,0,0,'+(dch*.55).toFixed(2)+'))':'none';
 $('vg').style.background=vg}

let last=performance.now();
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(st!=='over')step(dt,st==='play');else dch+=(1-dch)*Math.min(1,dt*5);
 render(dt);hs.textContent='Skor '+score;hc.textContent='Koin '+coinsN;requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);

const mv=d=>{if(st!=='play')return;const jz=cur.L-s;
 if(d===cur.jd&&jz<4.5&&jz>-3){turn();return}
 const n=lane+d;if(n>=0&&n<3)lane=n};
const jump=()=>{if(st==='play'&&yj<=.01&&vy<=0)vy=9.5};
const dive=()=>{if(st==='play'){sl=.6;if(yj>0)vy=-18}};
addEventListener('keydown',e=>{const k=e.key;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
 if(st!=='play'){if(k==='Enter'||k===' ')start();return}
 if(k==='ArrowLeft'||k==='a')mv(-1);else if(k==='ArrowRight'||k==='d')mv(1);
 else if(k==='ArrowUp'||k==='w'||k===' ')jump();else if(k==='ArrowDown'||k==='s')dive()});
let sx=null,sy=0;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
addEventListener('pointermove',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<26)return;
 sx=e.clientX;sy=e.clientY;Math.abs(dx)>Math.abs(dy)?mv(dx>0?1:-1):dy<0?jump():dive()});
addEventListener('pointerup',()=>{sx=null});addEventListener('pointercancel',()=>{sx=null});
</script></body></html>
